name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle_output.txt

      - name: Save Log to Branch on Failure
        if: failure()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -B build-logs
          git add gradle_output.txt
          git commit -m "build log [skip ci]" || true
          git push origin build-logs -f

      - name: Print Gradle Errors as Annotations
        if: failure()
        run: |
          grep -i -C 2 -E "e: |FAILURE:|BUILD FAILED" gradle_output.txt | head -n 40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

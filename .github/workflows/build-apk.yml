name: Build Android APK

on:
  push:
    branches: [ "main", "master", "beta" ]
  pull_request:
    branches: [ "main", "master", "beta" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run regression tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --build-cache

      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --build-cache

      - name: Setup Release Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/aura-release.jks
            echo "Keystore restored, size: $(wc -c < app/aura-release.jks) bytes"
            sha256sum app/aura-release.jks
            if [ ! -s app/aura-release.jks ]; then
              echo "::error::Keystore file is empty!"
              exit 1
            fi
          else
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing in GitHub repository settings!"
            exit 1
          fi

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_STORE_PATH: aura-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'aura' }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aura' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'aura' }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --build-cache 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/*.apk AuraReader.apk

      - name: Upload Release APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-release-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Extract App Version
        if: github.event_name != 'pull_request'
        run: |
          APP_VER=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "App version is $APP_VER"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          target_commitish: ${{ github.sha }}
          name: "Aura Reader v${{ env.APP_VERSION }}"
          prerelease: false
          make_latest: true
          body: |
            # Aura Reader v${{ env.APP_VERSION }} 🎉

            Глобальное обновление читалки Aura Reader 2.0!

            ### ✨ Что нового:
            - 🍏 **Liquid Glass & желейная физика**: обновленный стиль оформления Liquid Glass со стеклянным островком навигации и живой кнопкой добавления книг с мягкой воблинг-физикой.
            - ⚡ **Сверхлёгкий вес и скорость**: приложение оптимизировано и теперь весит всего **~5 МБ** (более чем в 3 раза легче!), запускается мгновенно и работает плавно.
            - 🎨 **Улучшения интерфейса и контрастности**: отточен баланс тем, улучшена читаемость текста и плавность переходов в стилях Material Design 3 и Liquid Glass.
            - 📚 **Широкая поддержка форматов**: комфортное чтение **EPUB**, **FB2**, **FB2.ZIP**, **TXT**, **MOBI**, **PDF** и комиксов **CBZ**.
            - ✍️ **Улучшенное выделение текста**: свободное выделение фраз, предложений и абзацев подряд для удобного сохранения цитат.
            - 🌍 **Новые языки**: полная поддержка 6 языков интерфейса (Русский, English, Українська, Беларуская, Polski, Čeština).
            - 🛠️ Повышение стабильности, исправление разметки и аннотаций в книгах.
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Beta Release
        if: github.ref == 'refs/heads/beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          target_commitish: ${{ github.sha }}
          name: "Aura Reader v${{ env.APP_VERSION }} (Beta)"
          prerelease: true
          make_latest: false
          body: |
            Aura Reader v${{ env.APP_VERSION }} (Beta)

            🚀 Новая бета-версия, тестирование новых функций и исправлений.
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

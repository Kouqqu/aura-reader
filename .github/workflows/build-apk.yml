name: Build Android APK

on:
  push:
    branches: [ "main", "master", "beta" ]
  pull_request:
    branches: [ "main", "master", "beta" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run regression tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --build-cache

      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --build-cache

      - name: Setup Release Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/aura-release.jks
            echo "Keystore restored, size: $(wc -c < app/aura-release.jks) bytes"
            sha256sum app/aura-release.jks
            if [ ! -s app/aura-release.jks ]; then
              echo "::error::Keystore file is empty!"
              exit 1
            fi
          else
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing in GitHub repository settings!"
            exit 1
          fi

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_STORE_PATH: aura-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'aura' }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aura' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'aura' }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --build-cache 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          prerelease: true
          make_latest: false
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/*.apk AuraReader.apk

      - name: Upload Release APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: AuraReader-release-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Extract App Version
        if: github.event_name != 'pull_request'
        run: |
          APP_VER=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "App version is $APP_VER"

      - name: Calculate APK SHA-256 and Submit to VirusTotal
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          SHA256=$(sha256sum AuraReader.apk | cut -d' ' -f1)
          echo "APK_SHA256=$SHA256" >> $GITHUB_ENV
          echo "APK SHA-256 is $SHA256"
          if [ -n "$VT_API_KEY" ]; then
            echo "Submitting APK to VirusTotal..."
            UPLOAD_URL=$(curl -s -X GET "https://www.virustotal.com/api/v3/files/upload_url" -H "x-apikey: $VT_API_KEY" | jq -r .data)
            if [ -n "$UPLOAD_URL" ] && [ "$UPLOAD_URL" != "null" ]; then
              curl -s -X POST "$UPLOAD_URL" -H "x-apikey: $VT_API_KEY" -F "file=@AuraReader.apk" > /dev/null
              echo "VirusTotal upload finished successfully."
            fi
          fi

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          target_commitish: ${{ github.sha }}
          name: "Aura Reader v${{ env.APP_VERSION }}"
          prerelease: false
          make_latest: true
          body: |
            # Aura Reader v${{ env.APP_VERSION }} 🎉

            ### ✨ Что нового:
            - 🛡️ **Проверка на вирусы**: [Отчёт безопасности VirusTotal](https://www.virustotal.com/gui/file/${{ env.APK_SHA256 }})
            - 🌟 **Интерактивный гид Material 3 Expressive**:
              - 🎨 Интерактивный стиль при первом входе — мгновенное переключение между Material 3 Expressive и Liquid Glass в реальном времени.
              - 📚 Знакомство с библиотекой, поддержкой форматов (EPUB, FB2, MOBI, PDF, TXT, CBZ) и OPDS каталогами.
              - 🎙️ Демонстрация озвучки и живой подсветки слов.
              - 🚀 Кнопка быстрого запуска и возможность повторно открыть гид из настроек приложения.
            - ✨ **Живая подсветка читаемого слова в TTS**:
              - 🔍 При воспроизведении озвучки с нижним плеером текущее произносимое слово плавно подсвечивается прямо в тексте книги.
              - 📜 Автоматический скролл и перелистывание страниц вслед за голосом диктора.
            - 💬 **Официальный Telegram-канал**:
              - Прямая ссылка на канал https://t.me/koukkuteka в настройках и в гиде.
            - 🇮🇱 **Локализация на иврит**:
              - Добавлена полная поддержка иврита (עברית).
            - ❤️ **Авторская подпись**:
              - «Stworzone z ❤️ przez Koukku» в самом низу настроек.
            - 🎙️ **Продвинутая озвучка текста (TTS)**:
              - Озвучка от выбранного слова, точное сохранение позиции, перемотка по абзацам, запоминание голоса и скорости.

            Политика конфиденциальности: [PRIVACY.md](https://github.com/Kouqqu/aura-reader/blob/main/PRIVACY.md)
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Beta Release
        if: github.ref == 'refs/heads/beta' && contains(env.APP_VERSION, 'beta')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          target_commitish: ${{ github.sha }}
          name: "Aura Reader v${{ env.APP_VERSION }} (Beta)"
          prerelease: true
          make_latest: false
          body: |
            # Aura Reader v${{ env.APP_VERSION }} 🎉

            ### ✨ Что нового в 2.2.0 Beta 12:
            - 🔕 **Анонимная статистика стала честнее**: раньше часть событий отправлялась ещё до проверки настройки. Теперь приложение запускает сбор только после того, как убедилось, что переключатель включён.
            - ⏹️ **Выключение тумблера работает сразу**: статистика останавливается в тот же момент, а ещё не отправленные события удаляются. Раньше приходилось ждать следующего запуска.
            - 🏷️ **Меньше путаницы в цифрах**: в статистику добавлены канал сборки (`stable` / `beta` / `debug`) и отдельное событие обновления версии. Отладочные сборки теперь вообще не попадают в живую статистику, а бета-события можно отфильтровать.
            - 🔁 **Обновления больше не считаются новыми пользователями**: при обновлении сохраняется тот же анонимный идентификатор установки.
            - 🛡️ **Проверка на вирусы**: [Отчёт безопасности VirusTotal](https://www.virustotal.com/gui/file/${{ env.APK_SHA256 }})

            ### 📚 Про вкладки каталога
            - Сейчас у Flibusta стабильно отвечает раздел «Новинки», а «Популярное», «Авторы» и «Жанры» периодически возвращают ошибку сервера (5xx) или таймаут. Это состояние самого сайта, а не приложения: клиент показывает ошибку, когда сервер её действительно вернул.
            - Если каталог не открывается совсем — проверьте соединение или укажите рабочее зеркало в «Настройки OPDS». Домен `flibusta.su` не связан с библиотекой: не вводите там пароли и не скачивайте файлы.

            ### 📦 Ранее в 2.2.0 Beta 11:
            - 🟢 **Огонёк состояния каталога**: рядом с заголовком «Онлайн-каталог» теперь есть индикатор. Зелёный — сервер отвечает, красный — нет связи, жёлтый — идёт проверка.

            ### 📦 Ранее в 2.2.0 Beta 10:
            - 📚 **OPDS**: смена адреса каталога теперь применяется сразу — раньше сохранённый адрес игнорировался. Кнопка «Настройки OPDS» показывается при любой ошибке соединения, адрес можно вводить без `http://`, а кнопка «Сброс» возвращает встроенный каталог.
            - 💡 **Если каталог не открывается**: встроенный адрес `flibusta.is` может быть недоступен из вашей сети — это блокировка сайта, а не ошибка приложения. Укажите рабочее зеркало в «Настройки OPDS» или включите VPN.
            - ⚠️ Домен `flibusta.su` не связан с библиотекой: не вводите там пароли и не скачивайте файлы.
            - 🛠️ **Обновлён движок сборки**: Gradle 9.8.2, Android Gradle Plugin 9.4.1, Kotlin 2.4.21, Compose BOM 2026.09, Haze 1.7.3, Navigation 2.10.2, Lifecycle 2.11.0. Приложение стало легче: 5,17 МБ → 4,87 МБ.
            - 📚 **Форматы .mobi, .azw3 и .cbz** теперь открываются из других приложений через «Открыть с помощью».
            - 💎 **Liquid Glass**: размытие обрезается по форме через новый API Haze — визуально без изменений.
            - 🎬 **Анимация обложки** между библиотекой и книгой переведена на новый API Compose.
            - 🎯 **targetSdk 36** — требование Google Play с августа 2026 года.

            ### 🔍 Что стоит проверить в этой сборке:
            - тумблер «Анонимная статистика»: выключить, перезапустить приложение — новые события не должны появляться;
            - углы и размытие стеклянных элементов (док, шторки, карточки, тумблер);
            - переход обложки библиотека → книга и обратно;
            - огонёк каталога: зелёный при VPN, красный без него;
            - озвучка с подсветкой слов, OPDS (смена адреса и сброс), виджет, резервная копия.

            Полный список технических изменений: [docs/upgrades.md](https://github.com/Kouqqu/aura-reader/blob/beta/docs/upgrades.md)
            Политика конфиденциальности: [PRIVACY.md](https://github.com/Kouqqu/aura-reader/blob/beta/PRIVACY.md)
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

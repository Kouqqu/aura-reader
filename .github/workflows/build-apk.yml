name: Build Android APK

on:
  push:
    branches: [ "main", "master", "beta" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/aura-release.jks
          fi

      - name: Build Release APK
        env:
          SIGNING_KEY_STORE_PATH: aura-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'aura' }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aura' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'aura' }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        run: cp app/build/outputs/apk/release/*.apk AuraReader.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-release-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Extract App Version
        run: |
          APP_VER=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "App version is $APP_VER"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "Aura Reader v${{ env.APP_VERSION }}"
          prerelease: false
          make_latest: true
          body: |
            Aura Reader v${{ env.APP_VERSION }}:

            📖 **Чтение и управление**:
            - Интерактивная карточка книги: нажатие на обложку и название вверху читалки открывает карточку книги с прогрессом и подробной информацией.
            - Анимация «Разворот»: эффект перелистывания страниц книги.
            - Плавное листание между главами с сохранением выбранного стиля анимации.
            - Увеличен и оптимизирован отступ текста сверху: текст больше не заходит за вырез камеры и не перекрывается строкой состояния.
            - Мгновенное снятие выделения слова при нажатии в любое место экрана или по системной кнопке «Назад».
            - Полноэкранный режим чтения со скрытием строки состояния во время чтения.

            ✍️ **Шрифты и оформление**:
            - Добавлен шрифт Google Sans в категорию «Без засечек».
            - Встроенные книжные шрифты Literata от Google, PT Serif, Lora, Inter и JetBrains Mono, работающие полностью офлайн.
            - Аккуратное отображение тире и диалогов.
            - Компактные и аккуратные значки форматов книг в библиотеке.

            🔄 **Обновления приложения**:
            - Удобный выбор канала обновлений (Релиз или Бета) в настройках.
            - Новые кнопки в окне обновления: «Позже» (напомнить при следующем запуске) и «Не напоминать» (пропустить эту версию).
            - Исправлено получение и установка обновлений прямо из приложения.

            🎧 **Озвучка текста**:
            - Исправлено возобновление чтения вслух после паузы.
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Beta Release
        if: github.ref == 'refs/heads/beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "Aura Reader v${{ env.APP_VERSION }}"
          prerelease: true
          make_latest: false
          body: |
            Aura Reader v${{ env.APP_VERSION }}:

            ✨ **Что нового в бете 1.4.3 (Beta 3)**:
            - 📚 **Поддержка серий и циклов книг**:
              - Автоматическое распознавание циклов и номеров книг в сериях из метаданных FB2 (включая Флибусту), EPUB (Calibre и EPUB3) и CBZ.
              - Отображение серии и номера части книги в библиотеке (в списке и сетке), а также в карточке «О книге».
              - Быстрая фильтрация библиотеки по чипу «Серии» и сортировка книг «По сериям».
              - Автоматическое предложение открыть следующую книгу цикла по завершении чтения.
            - 🦸 **Поддержка формата комиксов и манги CBZ**:
              - Чтение архивов `.cbz` с автоматической естественной сортировкой страниц (natural order).
              - Чтение метаданных `ComicInfo.xml` (название, серия, номер, сценарист).
              - Оптимизированный показ страниц комиксов от края до края как в постраничном режиме, так и в режиме непрерывной вертикальной ленты (Webtoon).
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/*.apk AuraReader.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-debug-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.4"
          name: "Aura Reader v1.0.4"
          body: |
            Обновление Aura Reader v1.0.4:
            - 📖 **Чёткий логотип в заголовке**: устранён артефакт сплошного квадрата вместо логотипа рядом с названием приложения — теперь отображается открытая книга Material You с аккуратным акцентным фоном.
            - 🎯 **Оптимизированный размер адаптивной иконки**: иконка аккуратно уменьшена до 40x46dp с безопасными отступами, благодаря чему она идеально помещается в рамки скруглений One UI / Samsung и любых лаунчеров без вылезания за края.
            - 📂 **Мультивыбор через «Мои файлы» Samsung**: кнопка «+ Добавить книги» теперь открывает нативный проводник устройства (`GetMultipleContents`) с возможностью выбора сразу нескольких книг флажками (поддерживаются как FB2, так и EPUB).
            - 💾 **Локальное кэширование книг**: импортированные книги надежно сохраняются во внутреннее хранилище приложения — книги всегда гарантированно открываются даже после очистки папки «Загрузки» или отзыва временных системных прав.
            - 🔑 **Постоянная цифровая подпись**: сборка подписана постоянным ключом для бесшовного обновления.
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

on:
  push:
    branches: [ "main", "master", "beta" ]
  pull_request:
    branches: [ "main", "master", "beta" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run regression tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --build-cache

      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --build-cache

      - name: Setup Release Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/aura-release.jks
            echo "Keystore restored, size: $(wc -c < app/aura-release.jks) bytes"
            sha256sum app/aura-release.jks
            if [ ! -s app/aura-release.jks ]; then
              echo "::error::Keystore file is empty!"
              exit 1
            fi
          else
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing in GitHub repository settings!"
            exit 1
          fi

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_STORE_PATH: aura-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'aura' }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aura' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'aura' }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --build-cache 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          prerelease: true
          make_latest: false
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/*.apk AuraReader.apk

      - name: Upload Release APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: AuraReader-release-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Extract App Version
        if: github.event_name != 'pull_request'
        run: |
          APP_VER=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "App version is $APP_VER"

      - name: Calculate APK SHA-256 and Submit to VirusTotal
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          SHA256=$(sha256sum AuraReader.apk | cut -d' ' -f1)
          echo "APK_SHA256=$SHA256" >> $GITHUB_ENV
          echo "APK SHA-256 is $SHA256"
          if [ -n "$VT_API_KEY" ]; then
            echo "Submitting APK to VirusTotal..."
            UPLOAD_URL=$(curl -s -X GET "https://www.virustotal.com/api/v3/files/upload_url" -H "x-apikey: $VT_API_KEY" | jq -r .data)
            if [ -n "$UPLOAD_URL" ] && [ "$UPLOAD_URL" != "null" ]; then
              curl -s -X POST "$UPLOAD_URL" -H "x-apikey: $VT_API_KEY" -F "file=@AuraReader.apk" > /dev/null
              echo "VirusTotal upload finished successfully."
            fi
          fi

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          target_commitish: ${{ github.sha }}
          name: "Aura Reader v${{ env.APP_VERSION }}"
          prerelease: false
          make_latest: true
          body: |
            # Aura Reader v${{ env.APP_VERSION }} 🎉

            ### ✨ Что нового:
            - 🛡️ **Проверка на вирусы**: [Отчёт безопасности VirusTotal](https://www.virustotal.com/gui/file/${{ env.APK_SHA256 }})
            - 🌟 **Интерактивный гид Material 3 Expressive**:
              - 🎨 Интерактивный стиль при первом входе — мгновенное переключение между Material 3 Expressive и Liquid Glass в реальном времени.
              - 📚 Знакомство с библиотекой, поддержкой форматов (EPUB, FB2, MOBI, PDF, TXT, CBZ) и OPDS каталогами.
              - 🎙️ Демонстрация озвучки и живой подсветки слов.
              - 🚀 Кнопка быстрого запуска и возможность повторно открыть гид из настроек приложения.
            - ✨ **Живая подсветка читаемого слова в TTS**:
              - 🔍 При воспроизведении озвучки с нижним плеером текущее произносимое слово плавно подсвечивается прямо в тексте книги.
              - 📜 Автоматический скролл и перелистывание страниц вслед за голосом диктора.
            - 💬 **Официальный Telegram-канал**:
              - Прямая ссылка на канал https://t.me/koukkuteka в настройках и в гиде.
            - 🇮🇱 **Локализация на иврит**:
              - Добавлена полная поддержка иврита (עברית).
            - ❤️ **Авторская подпись**:
              - «Stworzone z ❤️ przez Koukku» в самом низу настроек.
            - 🎙️ **Продвинутая озвучка текста (TTS)**:
              - Озвучка от выбранного слова, точное сохранение позиции, перемотка по абзацам, запоминание голоса и скорости.

            Политика конфиденциальности: [PRIVACY.md](https://github.com/Kouqqu/aura-reader/blob/main/PRIVACY.md)
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Beta Release
        if: github.ref == 'refs/heads/beta' && contains(env.APP_VERSION, 'beta')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          target_commitish: ${{ github.sha }}
          name: "Aura Reader v${{ env.APP_VERSION }} (Beta)"
          prerelease: true
          make_latest: false
          body: |
            # Aura Reader v${{ env.APP_VERSION }} 🎉

            ### ✨ Что нового в 2.2.0 Beta 41:
            - 🔘 **Связанная пара действий (Split Action Pair)**: убрана лишняя дублирующая стрелочка у сортировки. Теперь панель действий библиотеки объединена в компактную пару Material 3 Expressive Split Button `[ ≡ Недавние ] [ ☷ ]` — ведущая часть открывает меню сортировки, а ведомая переключает сетку и список.
            - 🎯 **Исправление эффекта нажатия (Ripple)**: устранена прямоугольная заливка при нажатии. Теперь волна ripple и анимация нажатия строго ограничены формой кнопок и чипсов (`Modifier.clip(shape)`), края не вылезают за скругления.
            - 🏷️ **Material 3 Expressive Chips**: чипсы коллекций и фильтров обновлены по стандарту Material Expressive (высота 36dp, форма squircle 16dp, токены secondaryContainer/outlineVariant, плавная анимация появления галочки при выборе).
            - 📊 **Закруглённые индикаторы прогресса**: прогресс-бары в карточках книг, шторке озвучки и окне информации приведены к Expressive-стандарту (`strokeCap = StrokeCap.Round`, высота 6dp).
            - 🛡️ **Проверка на вирусы**: [Отчёт безопасности VirusTotal](https://www.virustotal.com/gui/file/${{ env.APK_SHA256 }})

            ### 📦 Ранее в 2.2.0 Beta 40:
            - 🔘 **Material 3 Expressive Split Button**: раздельные кнопки по официальным гайдлайнам Google M3 (https://m3.material.io/components/split-button/overview). Ведущая кнопка действия (скругление 20dp снаружи, 4dp внутри) и ведомая кнопка с шевроном меню (скругление 4dp внутри, 20dp снаружи) с зазором 2dp, высотой 40dp и плавной анимацией вращения шеврона. Интегрировано в сортировку библиотеки и онлайн-каталога OPDS (в OPDS нажатие на основную часть быстро переключает направление сортировки, а на стрелку — открывает меню).
            - 🔲 **Material 3 Expressive Buttons**: выровнены кнопки действий по спецификации Material 3 Expressive (высота 40dp, squircle форма для переключателя сетки/списка, pill форма 20dp для кнопки «Продолжить чтение» в карточке книги).
            - 🌍 **Исправление локализации**: скорректировано белорусское поздравление ко Дню влюблённых.

            ### 📦 Ранее в 2.2.0 Beta 39:
            - 💗 **День влюблённых**: новый сезон с 10 по 15 февраля — розово-красная палитра, бейдж с сердцем, поздравление и конфетти из сердечек и роз. Включается и выключается тем же тумблером «Праздничная атмосфера».
            - 🐣 **Пасха**: сезон за два дня до и один день после Пасхи — и западной, и православной. Дата каждый год считается сама, таблицы не нужны; весенняя зелёно-золотая палитра, бейдж с цыплёнком и поздравление на всех семи языках.

            ### 📦 Ранее в 2.2.0 Beta 38:
            - 🎵 **Уточнена подпись звука Хэллоуина**: это трек «Spooky Ghosts» (Halloween intro music) от Gfx Sounds. В файле атрибуции теперь есть название, автор и ссылка на его страницу на Uppbeat.
            - 🔤 **Лицензии шрифтов**: все семь встроенных шрифтов распространяются по SIL OFL 1.1 — включая Google Sans из открытого релиза `googlefonts/googlesans`. Добавлен файл `assets/licenses/fonts.txt` со списком шрифтов, копирайтами и ссылкой на текст лицензии.

            ### 🌟 Что появилось в бетах 18–38:
            - 🌍 **Праздники на семи языках**: Хэллоуин, Рождество, Новый год и зимние праздники называют себя и поздравляют на языке приложения, а не только по-русски.
            - 🔤 **Свои шрифты**: в настройках можно подключить любой TTF/OTF, выбрать его для всего приложения и удалить. По умолчанию — Google Sans, а логотип «Aura Reader» набран шрифтом Marcellus.
            - 💎 **Liquid Glass**: переключатели с настоящим преломлением и прозрачностью, тёмный стеклянный док, направленные переходы и аккуратные кромки без «призрачных» рамок.
            - 🧩 **Material Expressive**: панель действий в библиотеке (сортировка, фильтры, вид), половинные шторки с изоляцией прокрутки и единый «желейный» overscroll с одним отскоком.
            - 📚 **Библиотека**: ручные полки и защита от авто-перемещения, исправленное удаление коллекций, переработанные полка «Читаю» и карточка «Читаю сейчас», трофей и конфетти при завершении книги.
            - 🗂️ **Каталог OPDS**: сортировка по числу читателей и направление сортировки, исправленный жест «назад», убранные дубли чипов категорий.
            - 📖 **Читалка**: настоящие названия глав в нижней панели, слайд-переход в книгу и обратно, сворачивание логотипа при прокрутке, отступы и белая строка состояния в шторках, бейдж формата книги.
            - 🎃 **Праздники**: Хэллоуин и зимние события по календарю, отдельные палитры, анимированный бейдж, поздравления, звук и полное отключение в настройках.
            - 🛠️ **Надёжность**: исправлен вылет озвучки на Android 14+, системный жест «назад» больше не перехватывается без причины, убрано дёрганье верхней панели.
            - ✅ **Тесты**: регрессионные проверки книг, коллекций и ручных полок, тесты границ праздничных дат.

            ### 📦 Ранее в 2.2.0 Beta 17:
            - 🐞 **Исправлено переключение страниц**: при листании книги приложение вылетало. Ошибка появилась в beta 16 вместе с новым способом чтения выделенного текста: одну и ту же «корзину выделения» использовали сразу несколько страниц, и при пролистывании Compose выбрасывал исключение. Теперь у каждой страницы своё состояние выделения.
            - ✨ **Новая заставка при запуске**: вместо белой вспышки — экран с логотипом на фирменном фоне (светлом или тёмном, в зависимости от темы системы). Приложение больше не замирает на старте: настройки читаются в фоне, а заставка держится ровно столько, сколько нужно.

            ### 📦 Ранее в 2.2.0 Beta 16:
            - 🌍 **Перевод с любого языка на любой**: в окне перевода появились два выбора — язык оригинала (по умолчанию «Авто», определяется сам) и язык перевода (по умолчанию язык приложения). Выбор применяется сразу и запоминается до перезапуска.
            - 📋 **Цитата, словарь и перевод больше не трогают буфер обмена**: выделенный текст читается напрямую, поэтому нажатие этих кнопок не копирует его. Копирует только кнопка «Копировать».

            ### 📦 Ранее в 2.2.0 Beta 15:
            - 📝 **Вернулась панель выделения текста**: при выделении снова появляется меню приложения — цитата, словарь, перевод и озвучка с этого места.
            - 📜 **Оглавление нормально прокручивается**: у длинных книг список листается внутри шторки, у коротких шторка остаётся компактной.

            ### 📦 Ранее в 2.2.0 Beta 14:
            - 🧹 **Внутренняя уборка кода**: три самых больших экрана — читалка, библиотека и настройки — разбиты на небольшие файлы по смыслу. В интерфейсе отличий быть не должно.

            ### 📚 Про вкладки каталога
            - Сейчас у Flibusta стабильно отвечает раздел «Новинки», а «Популярное», «Авторы» и «Жанры» периодически возвращают ошибку сервера (5xx) или таймаут. Это состояние самого сайта, а не приложения.
            - Если каталог не открывается совсем — проверьте соединение или укажите рабочее зеркало в «Настройки OPDS». Домен `flibusta.su` не связан с библиотекой: не вводите там пароли и не скачивайте файлы.

            ### 🔍 Что стоит проверить в этой сборке:
            - сезонный режим разработчика (после семи нажатий на номер версии): пункты «💗 Валентин» и «🐣 Пасха» включают бейдж, поздравление, палитру и конфетти;
            - реальные даты: 10–15 февраля — Валентин; около западной и православной Пасхи — пасхальное оформление (в 2026 году это 3–6 и 10–13 апреля);
            - любой язык, кроме русского: бейдж сезона и поздравление в шапке библиотеки должны быть на выбранном языке;
            - выключатель «Праздничная атмосфера» в настройках: выключенный возвращает обычное оформление;
            - быстрый проход по основному: добавление книги, чтение и озвучка, шторки, каталог OPDS, резервная копия.

            Полный список технических изменений: [docs/upgrades.md](https://github.com/Kouqqu/aura-reader/blob/beta/docs/upgrades.md)
            Политика конфиденциальности: [PRIVACY.md](https://github.com/Kouqqu/aura-reader/blob/beta/PRIVACY.md)
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/aura-release.jks
          fi

      - name: Build Release APK
        env:
          SIGNING_KEY_STORE_PATH: aura-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'aura' }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aura' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'aura' }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        run: cp app/build/outputs/apk/release/*.apk AuraReader.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-release-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.4.1"
          name: "Aura Reader v1.4.1"
          prerelease: false
          make_latest: true
          body: |
            Aura Reader v1.4.1:

            📖 **Чтение и верстка**:
            - Исправлено отображение текста на первой странице глав — текст больше не обрезается внизу экрана.
            - Скорректирован верхний отступ под статус-баром для более комфортного чтения.

            🖐️ **Библиотека и сортировка**:
            - Плавное перемещение книг перетаскиванием (включается долгим зажатием карточки).
            - Исправлена сортировка и сохранение порядка книг в библиотеке.
            - Исправлено создание и восстановление резервных копий.

            🌟 **Главный экран**:
            - Обновленная карточка «Сейчас читаю» с крупной обложкой и 3D Parallax эффектом.
            - Аккуратный прогресс-бар чтения и расчет оставшегося времени.

            ✨ **Эффекты и темы**:
            - Анимация мягкого свечения частиц при смене палитры темы.

            🎧 **Озвучка текста (TTS)**:
            - Удобное фоновое воспроизведение с управлением из шторки уведомлений.

            📱 **Виджет рабочего стола**:
            - Адаптивный виджет для главного экрана с поддержкой системных цветов Material You.

            🌐 **Локализация**:
            - Поддержка 5 языков: Русский, Английский, Украинский, Белорусский и Польский.
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

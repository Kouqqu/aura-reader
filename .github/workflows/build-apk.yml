name: Build Android APK

on:
  push:
    branches: [ "main", "master", "beta" ]
  pull_request:
    branches: [ "main", "master", "beta" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run regression tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --build-cache

      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --build-cache

      - name: Setup Release Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/aura-release.jks
            echo "Keystore restored, size: $(wc -c < app/aura-release.jks) bytes"
            sha256sum app/aura-release.jks
            if [ ! -s app/aura-release.jks ]; then
              echo "::error::Keystore file is empty!"
              exit 1
            fi
          else
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing in GitHub repository settings!"
            exit 1
          fi

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_STORE_PATH: aura-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'aura' }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aura' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'aura' }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --build-cache 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/*.apk AuraReader.apk

      - name: Upload Release APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-release-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Extract App Version
        if: github.event_name != 'pull_request'
        run: |
          APP_VER=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "App version is $APP_VER"

      - name: Calculate APK SHA-256 and Submit to VirusTotal
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          SHA256=$(sha256sum AuraReader.apk | cut -d' ' -f1)
          echo "APK_SHA256=$SHA256" >> $GITHUB_ENV
          echo "APK SHA-256 is $SHA256"
          if [ -n "$VT_API_KEY" ]; then
            echo "Submitting APK to VirusTotal..."
            UPLOAD_URL=$(curl -s -X GET "https://www.virustotal.com/api/v3/files/upload_url" -H "x-apikey: $VT_API_KEY" | jq -r .data)
            if [ -n "$UPLOAD_URL" ] && [ "$UPLOAD_URL" != "null" ]; then
              curl -s -X POST "$UPLOAD_URL" -H "x-apikey: $VT_API_KEY" -F "file=@AuraReader.apk" > /dev/null
              echo "VirusTotal upload finished successfully."
            fi
          fi

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          target_commitish: ${{ github.sha }}
          name: "Aura Reader v${{ env.APP_VERSION }}"
          prerelease: false
          make_latest: true
          body: |
            # Aura Reader v${{ env.APP_VERSION }} 🎉

            ### ✨ Что нового:
            - 🛡️ **Проверка на вирусы**: [Отчёт безопасности VirusTotal](https://www.virustotal.com/gui/file/${{ env.APK_SHA256 }})
            - 🌟 **Интерактивный гид Material 3 Expressive**:
              - 🎨 Интерактивный стиль при первом входе — мгновенное переключение между Material 3 Expressive и Liquid Glass в реальном времени.
              - 📚 Знакомство с библиотекой, поддержкой форматов (EPUB, FB2, MOBI, PDF, TXT, CBZ) и OPDS каталогами.
              - 🎙️ Демонстрация озвучки и живой подсветки слов.
              - 🚀 Кнопка быстрого запуска и возможность повторно открыть гид из настроек приложения.
            - ✨ **Живая подсветка читаемого слова в TTS**:
              - 🔍 При воспроизведении озвучки с нижним плеером текущее произносимое слово плавно подсвечивается прямо в тексте книги.
              - 📜 Автоматический скролл и перелистывание страниц вслед за голосом диктора.
            - 💬 **Официальный Telegram-канал**:
              - Прямая ссылка на канал https://t.me/koukkuteka в настройках и в гиде.
            - 🇮🇱 **Локализация на иврит**:
              - Добавлена полная поддержка иврита (עברית).
            - ❤️ **Авторская подпись**:
              - «Stworzone z ❤️ przez Koukku» в самом низу настроек.
            - 🎙️ **Продвинутая озвучка текста (TTS)**:
              - Озвучка от выбранного слова, точное сохранение позиции, перемотка по абзацам, запоминание голоса и скорости.
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Beta Release
        if: github.ref == 'refs/heads/beta' && contains(env.APP_VERSION, 'beta')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          target_commitish: ${{ github.sha }}
          name: "Aura Reader v${{ env.APP_VERSION }} (Beta)"
          prerelease: true
          make_latest: false
          body: |
            # Aura Reader v${{ env.APP_VERSION }} 🎉

            ### ✨ Что нового в Aura Reader 2.2 Beta:
            - 🛡️ **Проверка на вирусы**: [Отчёт безопасности VirusTotal](https://www.virustotal.com/gui/file/${{ env.APK_SHA256 }})
            - 💎 **Аутентичный дизайн Liquid Glass (iOS 26 / visionOS)**:
              - Устранена грубая неоновая обводка на экране первого запуска — карточка Liquid Glass теперь использует глубокое матовое стекло с тонким естественным отблеском по верхней грани (specular rim highlight).
              - С экрана приветствия убраны лишние надписи «Dynamic Color» и «Frosted Dock & Blur».
              - Переработан переключатель (Switch) в стиле iOS: фирменный зеленый трек (#34C759), выпуклая стеклянная 3D-линза бегунка с эффектом преломления и тактильным пружинным сжатием при нажатии.
            - 🎚️ **Тумблер отключения подсветки слов в озвучке (TTS)**:
              - Возможность отключить подсветку слов в шторке TTS («Подсветка слов»), если сетевой голос или движок синтезатора спешит или передаёт некорректные тайминги. Озвучка и автоматический переход страниц продолжают работать стабильно.
            - ⏱️ **Улучшенная синхронизация и исправленный интерфейс**:
              - Устранено наложение текста настройки задержки на узких экранах, задержка отображается в виде компактного бейджа («Авто» / «0 мс» / «-150 мс»).
            - 🌟 **Интерактивный гид первого запуска (Onboarding)**:
              - 🎨 Наглядный выбор стиля дизайна (Material 3 Expressive с динамической палитрой против Apple Liquid Glass с глянцевыми бликами и матовым стеклом).
              - 📚 Знакомство с поддержкой форматов (EPUB, FB2, MOBI, PDF, TXT, CBZ) и OPDS каталогами.
              - 🎙️ Демонстрация живой подсветки слов при озвучке.
              - 💬 Ссылка на официальный Telegram-канал и проект.
              - 🚀 Быстрый запуск и возможность повторно открыть гид из настроек приложения.
            - ✨ **Живая подсветка читаемого слова в TTS**:
              - 🔍 При воспроизведении озвучки с нижним плеером текущее произносимое слово плавно подсвечивается в реальном времени прямо в тексте книги.
              - 📜 Автоматический скролл и перелистывание страниц вслед за голосом диктора.
            - 🪟 **Плавающий док и идеальный скролл в настройках**:
              - Устранена черная подложка за навигационным островком — док теперь парит в воздухе, а настройки прокручиваются прямо под ним с эффектом матового размытия.
              - Увеличенный нижний отступ для комфортного доступа ко всем элементам.
            - 💬 **Официальный Telegram-канал**:
              - Прямая ссылка на канал https://t.me/koukkuteka в настройках и гиде.
            - 🇮🇱 **Локализация на иврит**:
              - Добавлена полная поддержка иврита (עברית).
            - ❤️ **Авторская подпись**:
              - «Stworzone z ❤️ przez Koukku» в самом низу настроек.
            - 🎙️ **Продвинутая озвучка текста (TTS)**:
              - 🚀 **Озвучка от выбранного слова**: выделите слово в тексте и начните чтение с него.
              - 🔄 **Точное возобновление**: озвучка запоминает позицию паузы и выхода из книги.
              - 🎚️ **Перемотка по абзацам**: интерактивный слайдер в шторке плеера.
              - 🗣️ **Выбор и запоминание голосов**: компактный выпадающий список языков, индикаторы пола голоса, предпрослушивание, запоминание настроек.
            - 📖 **Компактный мини-плеер**:
              - Плеер не перекрывает процент прочитанного и нижний индикатор прогресса.
            - 🔥 **Ударный режим**: корректное отображение серии чтения на главном экране.
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

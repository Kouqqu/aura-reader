name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/*.apk AuraReader.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-debug-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.3"
          name: "Aura Reader v1.0.3"
          body: |
            Обновление Aura Reader v1.0.3:
            - 🔑 **Постоянная цифровая подпись**: в репозиторий добавлен фиксированный keystore. Решена проблема с ошибкой «Приложение не установлено» при установке обновлений поверх предыдущих версий.
            - 🎨 **Адаптивная и тематическая иконка Material You**: поддержка динамических цветов Android 13+ (Themed Icon) — иконка приложения автоматически подстраивается под цветовую палитру вашей системы.
            - 📖 **Логотип в приложении**: фирменный логотип теперь отображается рядом с названием «Aura Reader» в заголовке библиотеки.
            - 🖼️ **Оптимизация прозрачных иллюстраций в тёмных темах**: контрастная светлая подложка под иллюстрации гарантирует чёткую видимость прозрачных PNG с чёрными сканами, рисунками и формулами (настраивается в параметрах чтения).
            - 📚 **Множественный выбор файлов**: теперь можно выбирать и добавлять в библиотеку сразу несколько книг одновременно.
            - 📂 **Поддержка любых файлов (*/*) и понятные ошибки**: кнопка «+ Добавить книги» открывает проводник для всех файлов, а приложение сразу понятно сообщает, если выбран неподдерживаемый формат.
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

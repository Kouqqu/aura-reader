name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/*.apk AuraReader.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-debug-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.4.1-beta"
          name: "Aura Reader v1.4.1 Beta"
          prerelease: true
          make_latest: true
          body: |
            Aura Reader v1.4.1 Beta — Поддержка MOBI и PDF, режим разработчика, ручная сортировка и доработки интерфейса:

            🌟 **Журнальная карточка «Сейчас читаю»**:
            - Новая стильная карточка на главном экране с крупной обложкой, адаптивным свечением палитры (Aura Glow) и мягкой объемной тенью.
            - Быстрый доступ к интерактивному 3D Parallax просмотру обложки по клику на миниатюру с физикой наклона и жестов.
            - Тонкий прогресс-бар чтения, оценка оставшегося времени и контекстное меню из 3 точек (избранное, управление, статистика).
            - Автоматическое скрытие текущей книги из списка «Недавние» для исключения дублирования.

            ✨ **Иммерсивные частицы смены тем (Aura Stardust)**:
            - При переключении темы чтения из центра кнопки по всему экрану разлетаются 180 мерцающих частиц с мягким двухслойным свечением (halo glow) в цвет выбранной палитры.
            - Плавная 2.4-секундная физика парения с замедлением.
            - Полностью неблокирующий интерфейс (non-blocking Canvas overlay) и идеальный круглый Material 3 ripple-эффект без квадратных артефактов.

            🎧 **Фоновая озвучка текста (TTS) & MediaSession**:
            - Новая удобная шторка управления чтением по нажатию на иконку наушников: воспроизведение/пауза, пошаговая навигация, регулировка скорости речи (0.5x – 2.0x) и тона.
            - Фоновое воспроизведение через системный MediaSession с удобным плеером в шторке уведомлений Android.
            - Полноэкранный выбор голосов системы с живым поиском и фильтрацией.

            📱 **Виджет рабочего стола Material You**:
            - Компактный и адаптивный виджет для главного экрана смартфона с поддержкой динамических системных цветов Material You (Dynamic Colors).
            - Отображение текущей книги, автора и прогресса чтения в одно касание.

            ⚡ **Комплексная оптимизация и плавность 120 FPS**:
            - Проведена глубокая оптимизация Jetpack Compose: устранена избыточная рекомпозиция, тяжелые вычисления вынесены в фоновые потоки.
            - Скоростной LRU-кэш обложек с умным даунсэмплингом (RGB_565), экономящий до 75% оперативной памяти.
            - Все модели данных помечены аннотацией Immutable для идеальной стабильности рендеринга.
            - Сборка с оптимизацией AOT: мгновенный холодный старт без микрофризов и стабильные 120 кадров в секунду.

            💬 **Цитаты и маркеры**:
            - Сохранение цитат из выделенного текста с возможностью выбора цвета маркера.
            - Быстрый просмотр и управление сохраненными фрагментами.

            📊 **Интерактивная статистика чтения**:
            - Детальная аналитика прогресса: общее время чтения, страницы, темп чтения и стрик активных дней с анимированными графиками.

            🌐 **Мультиязычность**:
            - 100% локализация интерфейса, настроек тем, шрифтов и озвучки на 5 языков: Русский (RU), Английский (EN), Украинский (UK), Белорусский (BE), Польский (PL).
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

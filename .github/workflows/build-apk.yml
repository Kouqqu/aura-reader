name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/aura-release.jks
          fi

      - name: Build Release APK
        env:
          SIGNING_KEY_STORE_PATH: aura-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'aura' }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aura' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'aura' }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK files
        run: |
          cp app/build/outputs/apk/release/*.apk AuraReader.apk
          cp app/build/outputs/apk/release/*.apk AuraReader-v1.4.1.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-release-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.4.1"
          name: "Aura Reader v1.4.1"
          prerelease: false
          make_latest: true
          body: |
            Aura Reader v1.4.1 — Официальный релиз с постоянной цифровой подписью разработчика:

            🔐 **Постоянный Release Keystore & Google Play Защита**:
            - Приложение теперь подписано официальным постоянным production-сертификатом (RSA 2048 / v1 + v2 + v3).
            - Устранены проблемы с алертами Google Play Protect («Рекомендуется проверка приложения»).
            - Пакет приложения собран в официальном релизном профиле без тестовых суффиксов.

            📖 **Идеальная верстка и чтение**:
            - Исправлено отображение текста на 1-й странице глав: добавлен защитный буфер 48dp, исключающий срез слов внизу страницы.
            - Оптимальный верхний отступ под статус-баром без потери полезного пространства.

            🖐️ **Интуитивный Drag-and-Drop в библиотеке**:
            - Плавное перемещение книг перетаскиванием с iOS-эффектом покачивания (Wobble).
            - Перемещение активируется исключительно через зажатие (долгий тап) карточки.
            - Единая сетка на базе LazyVerticalGrid со стабильными ключами и синхронным порядком в памяти.

            🌟 **Журнальная карточка «Сейчас читаю»**:
            - Стильная карточка на главном экране с крупной обложкой, адаптивным свечением палитры (Aura Glow) и 3D Parallax просмотром.
            - Тонкий прогресс-бар чтения и оценка оставшегося времени.

            ✨ **Иммерсивные частицы смены тем (Aura Stardust)**:
            - 180 мерцающих частиц с мягким свечением при смене палитры темы.

            🎧 **Фоновая озвучка текста (TTS) & MediaSession**:
            - Полноценное воспроизведение через системный MediaSession с управлением из шторки уведомлений Android.

            📱 **Виджет рабочего стола Material You**:
            - Компактный и адаптивный виджет для главного экрана смартфона с поддержкой динамических системных цветов Material You.

            🌐 **Мультиязычность**:
            - 100% локализация интерфейса на 5 языков: Русский (RU), Английский (EN), Украинский (UK), Белорусский (BE), Польский (PL).
          files: |
            AuraReader.apk
            AuraReader-v1.4.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

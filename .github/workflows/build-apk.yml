name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/*.apk AuraReader.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-debug-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.3.2"
          name: "Aura Reader v1.3.2"
          body: |
            Aura Reader v1.3.2 — Реалистичное перелистывание и доработка интерфейса:
            - 📖 Физическое перелистывание стопки страниц (Page Peel): верхняя страница стягивается за край пальцем с реалистичной тенью, открывая неподвижную нижнюю страницу.
            - ⚡ Мгновенное перелистывание (Instant): переключение страниц в 0 мс при свайпе и тапе без задержек и без сдвига.
            - 🎯 Контекстная плавающая панель под словом: всплывает строго над/под выделенным словом через Popup, исчезает при клике в любое свободное место, короткие лаконичные кнопки (Копировать • Цитата • Словарь • Перевод).
            - 📳 Управление вибрацией и прокрутка настроек: шторка настроек теперь открывается частично (не на весь экран), легко прокручивается, а тумблер виброотклика расположен на самом видном месте.
            - 👆 Увеличенные зоны тапа: комфортное листание страниц тапом по 64 dp краям экрана.
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

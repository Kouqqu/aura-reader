name: Build Android APK

on:
  push:
    branches: [ "main", "master", "beta" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/aura-release.jks
          fi

      - name: Build Release APK
        env:
          SIGNING_KEY_STORE_PATH: aura-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'aura' }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aura' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'aura' }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        run: cp app/build/outputs/apk/release/*.apk AuraReader.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-release-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Extract App Version
        run: |
          APP_VER=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "App version is $APP_VER"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "Aura Reader v${{ env.APP_VERSION }}"
          prerelease: false
          make_latest: true
          body: |
            Aura Reader v${{ env.APP_VERSION }}:

            📚 **Серии и циклы книг**:
            - Полная поддержка книжных серий и циклов: автоматическое чтение названий серий и номеров томов из метаданных FB2 и EPUB.
            - Удобная группировка и фильтрация по сериям в библиотеке с бейджами томов.
            - Диалог бесшовного перехода к следующей книге серии при завершении текущей книги.

            🎨 **Комиксы и новые форматы**:
            - Встроенная поддержка формата комиксов CBZ (архивы изображений JPG, PNG, WebP).
            - Быстрое извлечение обложек комиксов и оптимизированный постраничный просмотр.

            📑 **Структура и честное оглавление**:
            - Устранена искусственная нарезка книг: парсеры больше не разбивают текст на фиктивные «Глава N» или «Часть N».
            - В FB2 и EPUB иллюстрации, стихи и сценические перебивки отображаются прямо внутри текста своих глав, не создавая пустых глав из пары строк.
            - Честная навигация по стандартам TOC (toc.ncx / nav.xhtml) и корректный расчет времени до конца главы.
            - В MOBI удалено дробление текста по техническим разрывам страниц.

            🔍 **Онлайн-каталог (OPDS / Флибуста)**:
            - Расширенный поиск по вкладкам: раздельный поиск по «Книгам», «Авторам» и «Сериям».
            - Умный многословный поиск: возможность искать одновременно по названию книги и автору.
            - Исправлена кодировка для книг формата MOBI при загрузке из онлайн-каталога.

            📳 **Чтение и тактильный отклик**:
            - Одиночный чёткий тактильный щелчок (EFFECT_TICK) при перемещении ползунка страниц и глав вместо непрерывного жужжания.
            - Мгновенная прокрутка страниц при ведении ползунка без паразитных вибраций.
            - Корректный 3D-наклон обложки в альбомной ориентации на планшетах и смартфонах с аппаратной компенсацией поворота экрана.

            ✍️ **Настройки и интерфейс**:
            - Настройка отдельного шрифта для интерфейса приложения.
            - Раздельное запоминание выбранного шрифта для каждой категории (С засечками, Без засечек, Моноширинный).
            - Сброс статистики средней скорости чтения с окном подтверждения.
            - Добавлена чешская локализация интерфейса.
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Beta Release
        if: github.ref == 'refs/heads/beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "Aura Reader v${{ env.APP_VERSION }}"
          prerelease: true
          make_latest: false
          body: |
            Aura Reader v${{ env.APP_VERSION }}:

            ✨ **Что нового в бете 1.4.3 (Beta 6)**:
            - 📳 **Одиночная тактильная отдача для ползунка страниц**:
              - При перемещении ползунка страниц на нижней панели читалки воспроизводится аккуратный одиночный щелчок (EFFECT_TICK) на каждую страницу вместо непрерывного жужжания анимации перелистывания.
              - Страницы при ведении ползунка отображаются мгновенно без дребезга вибрации.
              - Добавлен одиночный тактильный отклик для кнопок листания и ползунка глав.
            - 🔄 **Корректный 3D-наклон обложки в горизонтальном режиме и на планшетах**:
              - Добавлена компенсация поворота экрана (`SensorManager.remapCoordinateSystem`) для всех ориентаций дисплея (альбомная, портретная, обратная).
              - На планшетах и телефонах в горизонтальном положении наклон вперёд теперь наклоняет обложку строго по вертикали, а не вправо.
              - Автоматическая калибровка нейтрального положения при смене ориентации экрана.
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

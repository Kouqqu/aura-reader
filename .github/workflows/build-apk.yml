name: Build Android APK

on:
  push:
    branches: [ "main", "master", "beta" ]
  pull_request:
    branches: [ "main", "master", "beta" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run regression tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --build-cache

      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --build-cache

      - name: Setup Release Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/aura-release.jks
            echo "Keystore restored, size: $(wc -c < app/aura-release.jks) bytes"
            sha256sum app/aura-release.jks
            if [ ! -s app/aura-release.jks ]; then
              echo "::error::Keystore file is empty!"
              exit 1
            fi
          else
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing in GitHub repository settings!"
            exit 1
          fi

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_STORE_PATH: aura-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'aura' }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aura' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'aura' }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --build-cache 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          prerelease: true
          make_latest: false
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/*.apk AuraReader.apk

      - name: Upload Release APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: AuraReader-release-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Extract App Version
        if: github.event_name != 'pull_request'
        run: |
          APP_VER=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "App version is $APP_VER"

      - name: Calculate APK SHA-256 and Submit to VirusTotal
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          SHA256=$(sha256sum AuraReader.apk | cut -d' ' -f1)
          echo "APK_SHA256=$SHA256" >> $GITHUB_ENV
          echo "APK SHA-256 is $SHA256"
          if [ -n "$VT_API_KEY" ]; then
            echo "Submitting APK to VirusTotal..."
            UPLOAD_URL=$(curl -s -X GET "https://www.virustotal.com/api/v3/files/upload_url" -H "x-apikey: $VT_API_KEY" | jq -r .data)
            if [ -n "$UPLOAD_URL" ] && [ "$UPLOAD_URL" != "null" ]; then
              curl -s -X POST "$UPLOAD_URL" -H "x-apikey: $VT_API_KEY" -F "file=@AuraReader.apk" > /dev/null
              echo "VirusTotal upload finished successfully."
            fi
          fi

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          target_commitish: ${{ github.sha }}
          name: "Aura Reader v${{ env.APP_VERSION }}"
          prerelease: false
          make_latest: true
          body: |
            # Aura Reader v${{ env.APP_VERSION }} 🎉

            ### ✨ Что нового в версии 2.2.1:
            - ☀️ **Приветствие по времени суток**: в шапке библиотеки появилось приятное приветствие («Доброе утро», «Добрый день», «Добрый вечер», «Доброй ночи»), которое автоматически обновляется в течение дня.
            - 📌 **Приоритет сносок и аннотаций у краёв экрана**: теперь при нажатии на значки сносок, ссылки или примечания, расположенные близко к краям страницы, всегда открывается сноска, а не перелистывается страница.
            - ⏱️ **Запоминание нижней плашки в книге**: выбранный вариант отображения в нижней плашке (проценты книги, оставшееся время до конца главы или номер страницы) теперь надёжно сохраняется между сессиями.
            - 💬 **Переход к цитатам и возврат к чтению**: нажатие на сохранённую цитату теперь сразу переносит вас к нужному фрагменту в тексте книги, а внизу появляется плавающая кнопка «Вернуться», позволяющая в один клик вернуться к месту чтения.
            - 📚 **Правильное распределение книг по полкам**: новые добавленные книги теперь автоматически попадают в раздел «К прочтению», а в коллекцию «Читаю сейчас» книга переходит только тогда, когда вы действительно начали её читать.
            - 🔘 **Отточенный дизайн кнопок Material 3 Expressive**: кнопки и переключатели библиотеки приведены в строгое соответствие с современными спецификациями Google — аккуратные скругления, плавные эффекты нажатия и гармоничные отступы.
            - 🛡️ **Проверка на вирусы**: [Отчёт безопасности VirusTotal](https://www.virustotal.com/gui/file/${{ env.APK_SHA256 }})

            Политика конфиденциальности: [PRIVACY.md](https://github.com/Kouqqu/aura-reader/blob/main/PRIVACY.md)
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Beta Release
        if: github.ref == 'refs/heads/beta' && contains(env.APP_VERSION, 'beta')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          target_commitish: ${{ github.sha }}
          name: "Aura Reader v${{ env.APP_VERSION }} (Beta)"
          prerelease: true
          make_latest: false
          body: |
            # Aura Reader v${{ env.APP_VERSION }} 🎉

            Первая бета 2.3 — оформление и красота. Зависимости и тулчейн не менялись.

            ### ✨ Что нового:
            - 🎃 **Праздничный стиль в любой день**: в «Оформлении» появился выбор праздничного оформления — Авто по календарю, Стандарт, Хэллоуин, Рождество 25 декабря, Новый год, Рождество 7 января, Зимние праздники, Валентин и Пасха. Плашки выглядят как выбор темы: цветная рамка у выбранной, отдача при нажатии, эмодзи и дата. Праздник включается сразу, даже летом, а «Стандарт» возвращает обычный вид. Старые тестовые чипы из раздела обновлений убраны.
            - 👋 **Приветствие под названием**: строка «Доброе утро», «Добрый день», «Добрый вечер» или «Доброй ночи» теперь начинается ровно под «Aura Reader», а не под логотипом — шапка выглядит ровнее. Праздничное поздравление осталось на месте.
            - ✨ **Свечение логотипа**: за иконкой появилось мягкое дыхание света в цвет темы или сезона — спокойная версия подсветки логотипа из GTA V. В свёрнутой шапке оно отключается, чтобы не мешать.
            - 🌊 **Современная волна загрузки**: скачивание из каталога OPDS теперь показывает волну по текущему виду Material 3 — волнуется и активная часть, и дорожка, с аккуратным зазором и точкой в конце.
            - 🛡️ **Проверка на вирусы**: [Отчёт безопасности VirusTotal](https://www.virustotal.com/gui/file/${{ env.APK_SHA256 }})

            ### 📦 Ранее в 2.2.1:
            - ☀️ Приветствие по времени суток, приоритет сносок у краёв экрана, память нижней плашки, переход к цитатам с кнопкой «Вернуться», полка «К прочтению».
            - 🔘 Кнопки Material 3 Expressive по официальным токенам Google.
            - 🔤 Шрифт Zakon для украинского интерфейса и исправленное уведомление о лицензиях.
            - 🎃 Праздничные палитры, бейджи и поздравления на семи языках.
            - Подробности прошлых выпусков остались в их собственных релизах.

            ### 🔍 Что стоит проверить в этой сборке:
            - «Оформление» → «Праздничный стиль»: все девять плашек, включая «Стандарт», переключают бейдж, палитру и поздравление; выбор сохраняется после перезапуска;
            - шапка библиотеки: приветствие начинается под названием, а за логотипом видно мягкое свечение в цвет темы; в праздник оно окрашивается в цвет сезона;
            - скачивание книги из OPDS: волна на карточке и на экране книги, проценты и отмена на месте;
            - быстрый проход по основному: добавление книги, чтение и озвучка, шторки, каталог OPDS, резервная копия.

            Полный список технических изменений: [docs/upgrades.md](https://github.com/Kouqqu/aura-reader/blob/beta/docs/upgrades.md)
            Политика конфиденциальности: [PRIVACY.md](https://github.com/Kouqqu/aura-reader/blob/beta/PRIVACY.md)
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

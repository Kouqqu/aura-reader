name: Build Android APK

on:
  push:
    branches: [ "main", "master", "beta" ]
  pull_request:
    branches: [ "main", "master", "beta" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run regression tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --build-cache

      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --build-cache

      - name: Setup Release Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/aura-release.jks
            echo "Keystore restored, size: $(wc -c < app/aura-release.jks) bytes"
            sha256sum app/aura-release.jks
            if [ ! -s app/aura-release.jks ]; then
              echo "::error::Keystore file is empty!"
              exit 1
            fi
          else
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing in GitHub repository settings!"
            exit 1
          fi

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_STORE_PATH: aura-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'aura' }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aura' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'aura' }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --build-cache 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          prerelease: true
          make_latest: false
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Extract App Version
        if: github.event_name != 'pull_request'
        run: |
          APP_VER=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "App version is $APP_VER"

      - name: Prepare APK file
        if: github.event_name != 'pull_request'
        run: |
          cp app/build/outputs/apk/release/*.apk "AuraReader-v${APP_VERSION}.apk"

      - name: Upload Release APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: AuraReader-release-apk
          path: AuraReader-v${{ env.APP_VERSION }}.apk
          if-no-files-found: error

      - name: Calculate APK SHA-256 and Submit to VirusTotal
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          SHA256=$(sha256sum "AuraReader-v${APP_VERSION}.apk" | cut -d' ' -f1)
          echo "APK_SHA256=$SHA256" >> $GITHUB_ENV
          echo "APK SHA-256 is $SHA256"
          if [ -n "$VT_API_KEY" ]; then
            echo "Submitting APK to VirusTotal..."
            UPLOAD_URL=$(curl -s -X GET "https://www.virustotal.com/api/v3/files/upload_url" -H "x-apikey: $VT_API_KEY" | jq -r .data)
            if [ -n "$UPLOAD_URL" ] && [ "$UPLOAD_URL" != "null" ]; then
              curl -s -X POST "$UPLOAD_URL" -H "x-apikey: $VT_API_KEY" -F "file=@AuraReader-v${APP_VERSION}.apk" > /dev/null
              echo "VirusTotal upload finished successfully."
            fi
          fi

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          target_commitish: ${{ github.sha }}
          name: "Aura Reader v${{ env.APP_VERSION }}"
          prerelease: false
          make_latest: true
          body: |
            # Aura Reader v${{ env.APP_VERSION }} 🎉

            ### ✨ Что нового в версии 2.3.0:

            **Библиотека**
            • **Личная папка** — скрывайте книги под пароль или отпечаток пальца: они не будут видны в общем списке и не попадут в поиск.  
            • **Профиль книги** — карточка книги, где можно менять название, автора, обложку и находить недостающие аннотации и жанры прямо из сети.  
            • **Корзина** — удалённые книги больше не исчезают насовсем, их всегда можно восстановить в один клик.  
            • **Выбор нескольких книг** — выделяйте книги пачкой, чтобы перемещать по полкам, отправлять в личную папку или удалять.  
            • **Резервная копия с выбором** — можно сохранить полный архив вместе с книгами для переноса на новый телефон или сделать быстрый лёгкий бэкап только с настройками, словарём и цитатами.

            **Чтение**
            • **Свой словарик** — сохраняйте незнакомые слова прямо при чтении и быстро переходите к нужному предложению в тексте.  
            • **Фоновые звуки** — во время чтения можно включить шум волн, дождь, потрескивание костра или звуки леса.  
            • **Комиксы и PDF** — чтение графических форматов сплошной вертикальной лентой без вылетов и лишней нагрузки на память.  
            • **Управление** — понятные подсказки при первом открытии книги и плавающая кнопка возврата к прочитанному месту после перехода по цитатам или словарю.  

            **Внешний вид и ридер**
            • **Режим для электронных книг (E-Ink)** — контрастное чёрно-белое оформление и мгновенное перелистывание экранов без мерцания.  
            • **Обновлённый гид** — лаконичный экран знакомства при первом запуске и быстрый выбор темы.  
            • **Новые форматы** — добавлена поддержка книг в Markdown (`.md`), HTML и комиксов, а также улучшено открытие архивов FB2.ZIP, PDF и CBZ.

            🛡️ **Проверка на вирусы**: [Отчёт безопасности VirusTotal](https://www.virustotal.com/gui/file/${{ env.APK_SHA256 }})

            Политика конфиденциальности: [PRIVACY.md](https://github.com/Kouqqu/aura-reader/blob/main/PRIVACY.md)
          files: AuraReader-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Beta Release Notes
        if: github.ref == 'refs/heads/beta' && contains(env.APP_VERSION, 'beta')
        run: |
          {
            echo "# Aura Reader v${APP_VERSION}"
            echo ""
            echo "### Что нового в этой бете:"
            git log -1 --pretty=format:"%B"
            echo ""
            echo ""
            echo "🛡️ **Проверка на вирусы**: [Отчёт безопасности VirusTotal](https://www.virustotal.com/gui/file/${APK_SHA256})"
            echo ""
            echo "Политика конфиденциальности: [PRIVACY.md](https://github.com/Kouqqu/aura-reader/blob/beta/PRIVACY.md)"
          } > beta-release-notes.md

      - name: Publish GitHub Beta Release
        if: github.ref == 'refs/heads/beta' && contains(env.APP_VERSION, 'beta')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          target_commitish: ${{ github.sha }}
          name: "Aura Reader v${{ env.APP_VERSION }} (Beta)"
          prerelease: true
          make_latest: false
          body_path: beta-release-notes.md
          files: AuraReader-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/*.apk AuraReader.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-debug-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.1.2"
          name: "Aura Reader v1.1.2"
          body: |
            Обновление Aura Reader v1.1.2:
            - Исправлено зависание при скрытии интерфейса: устранён рекурсивный цикл рекомпозиции и избыточной записи прогресса в хранилище.
            - Плавная анимация скрытия панелей: переход между верхней панелью и безопасным отступом строки состояния синхронизирован без деформации контейнера чтения.
            - Оптимизация сохранения прогресса: исключены повторные обращения к диску при неизменных координатах чтения.
            - Защита алгоритма разбивки страниц от зацикливания.
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

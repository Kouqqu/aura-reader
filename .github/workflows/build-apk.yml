name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          body_path: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/*.apk AuraReader.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-debug-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.2"
          name: "Aura Reader v1.0.2"
          body: |
            Обновление Aura Reader v1.0.2:
            - Независимое хранение книг разных форматов: файлы с одинаковым названием (например, FB2 и EPUB) теперь сохраняются в библиотеке параллельно и не заменяют друг друга
            - Полноценная поддержка книжных картинок и иллюстраций: извлечение и качественное отображение иллюстраций для FB2 и EPUB с подписями прямо в тексте
            - Верхняя панель управления теперь плавно сдвигает текст вниз при открытии, исключая перекрытие заголовков
            - Перелистывание глав свайпом: теперь можно переключать главы естественным горизонтальным жестом влево/вправо
            - Официальный логотип GitHub в верхнем меню библиотеки
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

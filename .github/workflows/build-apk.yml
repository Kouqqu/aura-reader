name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/*.apk AuraReader.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-debug-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.1.0"
          name: "Aura Reader v1.1.0"
          body: |
            Обновление Aura Reader v1.1.0:
            - Постраничный режим: переключение между вертикальной лентой и постраничным листанием с тапом по краям экрана.
            - Всплывающие сноски: быстрый просмотр примечаний в нижнем всплывающем окне по тапу на сноску.
            - Поиск по тексту: поиск слов и фраз внутри книги с навигацией по совпадениям и подсветкой текста.
            - Поиск по библиотеке: быстрая фильтрация книг на главном экране по названию и автору.
            - Удаление книг: удаление книги и очистка кэшированных данных через карточку книги.
            - Закладки и цитаты: сохранение закладок в один тап и отдельный раздел цитат и заметок.
            - Статистика чтения: учёт активного времени чтения за день на главном экране.
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

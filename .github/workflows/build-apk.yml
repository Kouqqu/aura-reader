name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/*.apk AuraReader.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-debug-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.1.1"
          name: "Aura Reader v1.1.1"
          body: |
            Обновление Aura Reader v1.1.1:
            - Независимое добавление книг: книги с одинаковым названием в разных форматах (FB2 и EPUB) теперь добавляются параллельно и не заменяют друг друга.
            - Ползунок страниц в постраничном режиме: нижний слайдер переключает страницы внутри главы, а переключение глав вынесено в отдельный блок управления.
            - Равномерное заполнение страниц: устранены пустые пространства и преждевременные разрывы страниц благодаря новому алгоритму компоновки текста по предложениям.
            - Интеграция с системной строкой состояния: текст больше не перекрывает часы и системные значки благодаря безопасным отступам.
            - Моментальные уведомления об обновлениях: встроенный баннер в библиотеке и системное уведомление при появлении новой версии без ограничений API.
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

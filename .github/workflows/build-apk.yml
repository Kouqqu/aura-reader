name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Publish Error Details to Release if failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Log"
          body: "Gradle build failed. Attached gradle-build.log contains the full build trace."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/*.apk AuraReader.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-debug-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.3.0"
          name: "Aura Reader v1.3.0"
          body: |
            Aura Reader v1.3.0 — Крупное обновление для максимального удобства чтения:
            - 📖 Умные переносы слов (Hyphenation): книжный перенос длинных слов по слогам через HarfBuzz/Skia без разрыва коротких слов и без дыр в строках (с тумблером в настройках).
            - 📱 Разворот книги (две страницы): автоматический книжный режим для планшетов и складных устройств Fold (экран >= 600dp) с аккуратным разделителем и настройками «Авто / 1 страница / 2 страницы».
            - ⚡ Анимации перелистывания страниц: выбор между плавным сдвигом, мгновенным переключением (0 мс) и кинематографичным растворением (Fade).
            - 📳 Тактильный отклик (Haptics): мягкая механическая вибрация при перелистывании страниц и прокрутке ползунка глав.
            - ⏱️ Индикатор прогресса в стиле Kindle: циклическое переключение по тапу на нижний индикатор — общий процент (%) -> оставшееся время чтения главы (WPM) -> точный номер страницы.
            - 💬 Компактные всплывающие карточки для сносок вместо громоздкой шторки на пол-экрана.
            - 🔍 Встроенный толковый словарь и переводчик: при выделении текста доступны кнопки «Словарь» (Википедия/Викисловарь) и «Перевод» (Google Translate) прямо в читалке.
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

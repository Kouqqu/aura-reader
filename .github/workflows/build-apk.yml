name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/*.apk AuraReader.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraReader-debug-apk
          path: AuraReader.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.1"
          name: "Aura Reader v1.0.1"
          body: |
            Обновление Aura Reader v1.0.1:
            - Улучшенная типографика: заголовки, подзаголовки, эпиграфы и цитаты с авторами (курсив с отступом справа), книжная красная строка
            - Исправлено оглавление EPUB со сложной структурой (больше никаких случайных "Глава 2, 3, 4" для обложек и вводных страниц)
            - Встроенный сканер книг на телефоне (папки Загрузки, Документы, Книги) для прямого открытия FB2 и EPUB
            - Встроенное автообновление прямо из приложения через GitHub Releases
            - Кнопка перехода в GitHub репозиторий в верхней панели
            - Симметричные удобные кнопки переключения глав снизу страницы
          files: AuraReader.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#281450" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="#6750A4"/>
  
  <!-- Book Body with soft shadow -->
  <rect x="157" y="145" width="198" height="228" rx="30" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <!-- Text lines inside book -->
  <rect x="197" y="195" width="118" height="20" rx="10" fill="#6750A4"/>
  <rect x="197" y="235" width="118" height="20" rx="10" fill="#6750A4"/>
  <rect x="197" y="275" width="78" height="20" rx="10" fill="#6750A4"/>
</svg>